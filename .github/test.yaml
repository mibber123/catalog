name: run test suite
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3
        run: |
          echo "Hello World"
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.10.12
        
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: run tests
        run: |
          python -m pytest